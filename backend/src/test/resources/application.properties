# ===================================================================
# Test Environment Configuration (H2 in PostgreSQL Compatibility Mode)
# ===================================================================
spring.application.name=sheladiya-backend-test

# H2 In-Memory Database with PostgreSQL Compatibility
spring.datasource.url=jdbc:h2:mem:sheladiya_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate creates and drops schema automatically in test
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Flyway disabled in test to let JPA manage fast in-memory schema
spring.flyway.enabled=false

# Test JWT Secret
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
jwt.expiration=86400000

# Test Admin Account
admin.default.username=testadmin
admin.default.email=admin@test.com
admin.default.password=Test@Sheladiya2026!

# CORS Allowed Origins
cors.allowed-origins=http://localhost:5173

# Disable external SMTP email sending in tests
app.mail.enabled=false
