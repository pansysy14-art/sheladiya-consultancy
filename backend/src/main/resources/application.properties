# ===================================================================
# Sheladiya Consultancy - Backend Configuration (Supabase PostgreSQL)
# ===================================================================
spring.application.name=sheladiya-backend
server.port=${PORT:8080}

# Database Connection (Supabase PostgreSQL via Environment Variables)
# Supports direct connection, Supabase Transaction Pooler, or local development
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/postgres?sslmode=prefer}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection Pool (HikariCP tuned for Supabase / PostgreSQL)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000

# JPA & Hibernate Settings (PostgreSQL 15+ Dialect)
# Set to 'validate' in production to protect existing data from accidental drop/alter
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Flyway Database Migrations
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration

# JWT Security Configuration
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration=${JWT_EXPIRATION_MS:86400000}

# Initial Default Administrator (Configurable via Environment Variables)
admin.default.username=${ADMIN_DEFAULT_USERNAME:admin}
admin.default.email=${ADMIN_DEFAULT_EMAIL:admin@sheladiyaconsultancy.com}
admin.default.password=${ADMIN_DEFAULT_PASSWORD:}

# CORS Allowed Origins (React Frontend)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:3000,http://127.0.0.1:5173,http://127.0.0.1:5174,http://127.0.0.1:5175}

# ===================================================================
# Automated Email Notification Configuration (Gmail SMTP)
# ===================================================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=*
spring.mail.properties.mail.smtp.ssl.protocols=TLSv1.2 TLSv1.3
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# Business Notification Recipient (Defaults to official business email)
app.mail.notification-to=${MAIL_TO:jeelsheladiya47@gmail.com}
app.mail.from-address=${MAIL_FROM:${spring.mail.username:jeelsheladiya47@gmail.com}}
app.mail.enabled=${MAIL_ENABLED:true}
